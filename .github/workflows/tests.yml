name: AURORA tests

on:
  push:
    branches: [codex, "feature/**"]
  pull_request:
    branches: [codex]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -q --upgrade pip && pip install -q -r requirements.txt
      - name: Run tests
        run: pytest -q --tb=short
