name: AURORA tests

on:
  push:
    branches: [codex, "feature/**"]
  pull_request:
    branches: [codex]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -q --upgrade pip && pip install -q -r requirements.txt
      - name: Run tests
        shell: bash
        run: |
          set +e
          pytest -q --tb=short > pytest.log 2>&1
          code=$?
          cat pytest.log
          exit $code
      - name: Upload pytest log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-log
          path: pytest.log
          retention-days: 3
